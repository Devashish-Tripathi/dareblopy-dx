name: Build and Release Wheels

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  build_wheels:
    name: Build Linux Wheels (Including Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.22.0

      - name: Build Wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
          CIBW_PRERELEASE_PYTHONS: "True"
          CIBW_BEFORE_ALL_LINUX: "yum install -y nasm || true"
          CIBW_TEST_SKIP: "cp314-*"
          CIBW_TEST_REQUIRES: "pytest numpy pillow"
          CIBW_TEST_COMMAND: "python -c \"import os, pytest, sys; os.chdir(r'{project}'); sys.exit(pytest.main(['test_dareblopy.py']))\""

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-linux
          path: ./wheelhouse/*.whl